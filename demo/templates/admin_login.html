<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QuizMester</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1> Admin Login</h1>
            <p>Log ind for at administrere quizzes</p>
            
            {% if fejl %}
            <div class="info-box" style="background: #fed7d7; border-left: 4px solid #e53e3e;">
                <p style="color: #e53e3e;">{{ fejl }}</p>
            </div>
            {% endif %}
            
            <form method="POST">
                <label>Brugernavn:</label>
                <input type="text" name="bruger" required>
                
                <label>Kodeord:</label>
                <input type="password" name="kodeord" required>
                
                <button type="submit">Log ind</button>
            </form>
            
            <div class="button-group">
                <a href="/" class="btn btn-secondary"> Til forsiden</a>
            </div>
        </div>
    </div>
</body>
</html>
